<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Red Ebenezer - Iglesia de Dios en Casa</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-link {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: #d6d3d1;
        }
        .auth-link a,
        .admin-toggle-btn {
            color: var(--bronze);
            font-weight: 700;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
        }
        .auth-link a:hover,
        .admin-toggle-btn:hover {
            text-decoration: underline;
        }
        .admin-divider {
            border-top: 1px solid #332d26;
            margin-top: 1.25rem;
            padding-top: 1rem;
            text-align: center;
        }
        #admin-login-box {
            display: none;
            margin-top: 1rem;
            text-align: left;
            background: #141210;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid #3f3830;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="img/logo-ebenezer.png" alt="Logo Red Ebenezer" class="login-logo">
                <p class="verse">“Hasta aquí nos ha ayudado Dios” — 1 Samuel 7:12</p>
                <h1>Reporte de Células</h1>
            </div>

            <div id="auth-msg" class="alert"></div>

            <!-- Acceso normal para Líderes Celulares (solo teléfono) -->
            <form id="login-form">
                <div class="form-group">
                    <label for="telefono">Número de Teléfono</label>
                    <input type="tel" id="telefono" class="form-control" placeholder="Ej: 04121234567" required>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary btn-block">Ingresar al Sistema</button>
            </form>

            <div class="auth-link">
                ¿Tienes una célula y aún no tienes cuenta?<br>
                <a href="registro.html">Regístrate aquí</a>
            </div>

            <!-- Acceso exclusivo para Administración -->
            <div class="admin-divider">
                <button type="button" class="admin-toggle-btn" onclick="toggleAdminLogin()">
                    Acceso al Panel Administrativo
                </button>

                <form id="admin-login-form">
                    <div id="admin-login-box">
                        <div class="form-group" style="margin-bottom:0.75rem;">
                            <label for="admin-password">Clave de Administración</label>
                            <input type="password" id="admin-password" class="form-control" placeholder="Ingresa la clave administrativa" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Entrar al Panel Admin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
