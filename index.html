<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Red Ebenezer - Iglesia de Dios en Casa</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-link {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: #d6d3d1;
        }
        .auth-link a {
            color: var(--bronze);
            font-weight: 700;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="img/logo-ebenezer.png" alt="Logo Red Ebenezer" class="login-logo">
                <p class="verse">“Hasta aquí nos ha ayudado Dios” — 1 Samuel 7:12</p>
                <h1>Reporte de Células</h1>
            </div>

            <div id="auth-msg" class="alert"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="lider@ebenezer.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary btn-block">Ingresar al Sistema</button>
            </form>

            <div class="auth-link">
                ¿Tienes una célula y aún no tienes cuenta? <br>
                <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
